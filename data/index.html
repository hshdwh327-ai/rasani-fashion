<!DOCTYPE html>
<html lang="id" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Konveksi Busana Muslim Soreang</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-50 text-zinc-900 font-sans min-h-screen">

    <header class="border-b border-stone-200 bg-stone-50 sticky top-0 z-50">
        <div class="navbar max-w-7xl mx-auto px-4 justify-between">
            <a class="text-xl font-semibold tracking-widest uppercase">SOREANG MODEST</a>
            <div class="flex gap-4">
                <a href="index.html" class="text-sm font-medium underline">Katalog</a>
                <a href="pasar.html" class="text-sm font-medium text-stone-500 hover:text-zinc-900">Modul Pasar</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-light tracking-wide mb-2">Koleksi Abaya & Gamis</h1>
            <p class="text-sm text-stone-500 max-w-md mx-auto">Sentra konveksi grosir berkualitas tinggi dengan presisi jahitan butik modern.</p>
        </div>

        <div id="katalog-produk" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12">
                <span class="loading loading-ring loading-lg text-stone-400"></span>
                <p class="text-xs text-stone-400 mt-2">Memuat koleksi...</p>
            </div>
        </div>
    </main>

    <script>
        async function ambilDataKatalog() {
            try {
                // Mengunduh berkas JSON dari folder data internal
                const respon = await fetch('data/inventory.json');
                const daftarProduk = await respon.json();
                const kontainerKatalog = document.getElementById('katalog-produk');
                
                kontainerKatalog.innerHTML = ''; // Hapus indikator loading

                daftarProduk.forEach(produk => {
                    produk.daftar_varian.forEach(varian => {
                        // Membentuk elemen kartu HTML menggunakan utilitas warna netral
                        const kartuHtml = `
                            <div class="card bg-stone-50 border border-stone-200 rounded-none shadow-none group">
                                <figure class="overflow-hidden bg-stone-100 relative aspect-[3/4]">
                                    <img src="${varian.foto}" alt="${produk.nama_model}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
                                    <span class="absolute top-3 left-3 badge badge-neutral rounded-none text-[10px] uppercase tracking-wider bg-zinc-900 text-zinc-50 border-none">
                                        Stok: ${varian.stok} Pcs
                                    </span>
                                </figure>
                                <div class="card-body p-4 bg-stone-50">
                                    <p class="text-[10px] text-stone-400 uppercase tracking-widest m-0">${produk.kategori}</p>
                                    <h2 class="card-title text-base font-normal m-0 text-zinc-900">${produk.nama_model}</h2>
                                    <p class="text-xs text-stone-600 my-1">Varian: <span class="font-medium">${varian.warna}</span></p>
                                    
                                    <div class="card-actions justify-between items-center mt-4 pt-2 border-t border-stone-200">
                                        <span class="text-sm font-semibold text-zinc-900">Rp ${produk.harga_grosir.toLocaleString('id-ID')}</span>
                                        <a href="https://wa.me/628123456789?text=Halo%20Admin,%20saya%20mau%20order%20${encodeURIComponent(produk.nama_model)}%20warna%20${encodeURIComponent(varian.warna)}" 
                                           target="_blank" 
                                           class="btn btn-sm bg-zinc-900 text-zinc-50 hover:bg-zinc-800 rounded-none text-xs border-none tracking-wider">
                                            Order Grosir
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `;
                        kontainerKatalog.insertAdjacentHTML('beforeend', kartuHtml);
                    });
                });
            } catch (error) {
                console.error("Gagal memproses data visual katalog:", error);
                document.getElementById('katalog-produk').innerHTML = `
                    <div class="col-span-full text-center py-12 border border-dashed border-stone-200">
                        <p class="text-sm text-red-700 font-medium">Gagal memuat katalog produk.</p>
                    </div>
                `;
            }
        }

        // Jalankan pemrosesan saat struktur DOM selesai diinisialisasi peramban
        document.addEventListener('DOMContentLoaded', ambilDataKatalog);
    </script>
</body>
</html>
