<!DOCTYPE html>
<html lang="id" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasani Fashion - Koleksi Eksklusif</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Aksen emas terinspirasi dari logo label Rasani */
       .text-emas { color: #D4AF37; }
       .border-emas { border-color: #D4AF37; }
    </style>
</head>
<body class="bg-stone-50 text-zinc-900 font-sans min-h-screen">
    
    <div class="bg-black text-center py-24 px-4 shadow-xl">
        <h1 class="text-5xl md:text-7xl font-serif text-emas tracking-widest mb-6">RASANI FASHION</h1>
        <p class="text-zinc-300 max-w-2xl mx-auto font-light text-sm md:text-base leading-relaxed mb-8">
            Menghadirkan Keanggunan dalam Setiap Helai Kain. Eksplorasi mahakarya gamis dan abaya premium kami, dirancang dengan siluet minimalis yang memancarkan pesona kesederhanaan paripurna.
        </p>
        <div class="inline-block border border-emas px-8 py-3 text-emas text-xs md:text-sm uppercase tracking-widest font-semibold shadow-[0_0_15px_rgba(212,175,55,0.2)]">
            📌 Stok akan selalu diperbarui setiap hari Jumat dan Selasa
        </div>
    </div>

    <div class="flex justify-center gap-10 py-6 bg-white border-b border-stone-200 text-xs md:text-sm font-medium uppercase tracking-widest sticky top-0 z-50 shadow-sm">
        <a href="index.html" class="text-black border-b-2 border-black pb-1">Katalog Produk</a>
        <a href="pasar.html" class="text-stone-400 hover:text-black transition-colors pb-1">Modul Kalkulator Pasar</a>
    </div>

    <main class="max-w-6xl mx-auto px-4 py-16">
        <div id="katalog-list" class="grid grid-cols-1 md:grid-cols-3 gap-10">
            </div>
    </main>

    <script>
        async function muatKatalog() {
            try {
                const respon = await fetch('data/inventory.json');
                const data = await respon.json();
                const container = document.getElementById('katalog-list');
                
                data.forEach(item => {
                    container.innerHTML += `
                    <div class="card bg-white rounded-none border border-stone-200 overflow-hidden group hover:shadow-2xl transition-all duration-300">
                        <figure class="aspect-[3/4] bg-stone-100 relative overflow-hidden">
                            <img src="${item.foto}" alt="${item.nama_model}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" />
                            <div class="absolute top-4 right-4 bg-black/80 backdrop-blur-sm text-emas text-[10px] px-4 py-1.5 uppercase tracking-widest border border-emas/50">
                                Sisa Stok: ${item.stok}
                            </div>
                        </figure>
                        <div class="p-8 text-center">
                            <p class="text-[10px] text-stone-400 uppercase tracking-widest mb-3">${item.kategori}</p>
                            <h2 class="text-xl font-serif text-zinc-900 mb-2">${item.nama_model}</h2>
                            <p class="text-xs text-stone-500 mb-5">Tersedia ${item.warna} Varian Motif</p>
                            <p class="text-lg font-semibold text-black tracking-wider">Rp ${item.harga_grosir.toLocaleString('id-ID')}</p>
                        </div>
                    </div>`;
                });
            } catch (e) {
                document.getElementById('katalog-list').innerHTML = '<p class="text-center w-full col-span-3 text-stone-500">Gagal memuat katalog. Pastikan file JSON ada.</p>';
            }
        }
        document.addEventListener('DOMContentLoaded', muatKatalog);
    </script>
</body>
</html>
