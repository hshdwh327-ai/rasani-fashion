
    <script>
        let dataBukuInduk = [];

        // Fungsi mengambil data JSON
        async function muatDataKatalog() {
            try {
                const respon = await fetch('data/inventory.json');
                if (!respon.ok) throw new Error('File JSON gagal dimuat');
                dataBukuInduk = await respon.json();
                renderTabel(dataBukuInduk);
            } catch (kesalahan) {
                console.error(kesalahan);
                document.getElementById('katalog-list').innerHTML = `
                    <tr><td colspan="5" class="text-center text-red-600 py-8 font-medium">Gagal memuat daftar produk. Pastikan file JSON sudah di-upload.</td></tr>
                `;
            }
        }

        // Fungsi menampilkan data ke tabel
        function renderTabel(data) {
            const tbody = document.getElementById('katalog-list');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-stone-400 py-10">Model tidak ditemukan.</td></tr>`;
                return;
            }

            data.forEach(item => {
                const teksUkuran = item.kategori.toLowerCase() === 'jumbo' ? 'XXL' : 'Dewasa (Normal/XL)';
                
                // RUMUS STOK OTOMATIS: Jumlah Warna dikali 50 pcs per warna default
                const totalStokOtomatis = item.warna * 50;
                
                // Warna lencana (badge) otomatis merah kalau stok kosong/sedikit
                const warnaBadgeStok = totalStokOtomatis < 30 ? 'bg-red-50 text-red-700 border-red-200' : 'bg-stone-50 text-zinc-700 border-stone-200';

                const barisHtml = `
                    <tr class="hover:bg-stone-50 cursor-pointer border-b border-stone-100 transition-colors group" 
                        onclick="bukaDetailProduk('${item.id_produk}')">
                        <td class="px-5 text-stone-500 py-4">${item.kategori}</td>
                        <td class="px-5 font-medium text-zinc-900 group-hover:text-zinc-600 transition-colors py-4">${item.nama_model}</td>
                        <td class="px-5 text-center text-stone-600 font-mono text-xs py-4">${teksUkuran}</td>
                        <td class="px-5 text-center py-4 flex justify-center gap-2">
                            <span class="badge bg-stone-50 text-stone-600 border-stone-200 rounded-none border text-[10px] px-2 py-3">
                                ${item.warna} Warna
                            </span>
                            <span class="badge ${warnaBadgeStok} rounded-none border text-[10px] px-2 py-3 font-semibold">
                                Stok: ${totalStokOtomatis} Pcs
                            </span>
                        </td>
                        <td class="px-5 text-right font-medium text-zinc-900 tracking-wide py-4">
                            Rp ${item.harga_grosir.toLocaleString('id-ID')}
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', barisHtml);
            });
        }

        // Fungsi pencarian real-time
        document.getElementById('kolom-pencarian').addEventListener('input', (e) => {
            const kataKunci = e.target.value.toLowerCase();
            const dataTerfilter = dataBukuInduk.filter(item => {
                return item.nama_model.toLowerCase().includes(kataKunci) ||
                       item.kategori.toLowerCase().includes(kataKunci);
            });
            renderTabel(dataTerfilter);
        });

        // Fungsi membuka Pop-up foto
        window.bukaDetailProduk = function(idProduk) {
            const item = dataBukuInduk.find(x => x.id_produk === idProduk);
            if (!item) return;
            
            const totalStokOtomatis = item.warna * 50;
            
            document.getElementById('modal-kategori').innerText = item.kategori;
            document.getElementById('modal-nama').innerText = item.nama_model;
            document.getElementById('modal-warna').innerText = item.warna;
            document.getElementById('modal-harga').innerText = 'Rp ' + item.harga_grosir.toLocaleString('id-ID');
            document.getElementById('modal-foto').src = item.foto;
            
            const teksWa = `Halo Admin Soreang Modest, saya mau tanya grosir untuk model *${item.nama_model}* dengan total stok tersedia *${totalStokOtomatis} Pcs*. Apakah siap kirim hari ini?`;
            document.getElementById('modal-wa').href = `https://wa.me/628123456789?text=${encodeURIComponent(teksWa)}`;
            
            document.getElementById('modal_produk').showModal();
        }

        document.addEventListener('DOMContentLoaded', muatDataKatalog);
    </script>
