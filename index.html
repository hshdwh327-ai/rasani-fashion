<!DOCTYPE html>
<html lang="id" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Grosir - Soreang Modest</title>
    <!-- Memuat Tailwind CSS & daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-stone-50 text-zinc-900 font-sans min-h-screen">

    <!-- Navigasi Atas -->
    <header class="border-b border-stone-200 bg-white sticky top-0 z-40 shadow-sm">
        <div class="navbar max-w-6xl mx-auto px-4 lg:px-8 justify-between">
            <a class="text-xl font-semibold tracking-widest uppercase text-zinc-900">SOREANG MODEST</a>
            <div class="flex gap-6">
                <a href="index.html" class="text-sm font-medium underline underline-offset-4 decoration-2 decoration-zinc-900">Katalog Stok</a>
                <a href="pasar.html" class="text-sm font-medium text-stone-400 hover:text-zinc-900 transition-colors">Modul Pasar</a>
            </div>
        </div>
    </header>

    <!-- Konten Utama: Header & Pencarian -->
    <main class="max-w-6xl mx-auto px-4 lg:px-8 py-10">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-light tracking-wide mb-2 text-zinc-900">Inventaris Gudang</h1>
                <p class="text-sm text-stone-500">Klik pada baris produk di bawah untuk melihat detail foto produk.</p>
            </div>
            
            <!-- Fitur Pencarian Dinamis -->
            <div class="w-full md:w-80 relative">
                <input type="text" id="kolom-pencarian" placeholder="Cari model, kategori, atau warna..." 
                       class="input input-bordered w-full rounded-none bg-white border-stone-300 text-sm focus:outline-none focus:border-zinc-900 focus:ring-1 focus:ring-zinc-900 transition-all px-4 pr-10" />
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute right-3 top-4 text-stone-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>

        <!-- Tabel Daftar Stok Tanpa Foto -->
        <div class="overflow-x-auto border border-stone-200 bg-white shadow-sm">
            <table class="table w-full text-sm">
                <!-- Kepala Tabel -->
                <thead class="bg-stone-100 text-stone-500 border-b border-stone-200 uppercase tracking-widest text-[10px]">
                    <tr>
                        <th class="font-semibold py-4 px-5">Kategori</th>
                        <th class="font-semibold py-4 px-5">Nama Model</th>
                        <th class="font-semibold py-4 px-5">Varian (Ukuran & Warna)</th>
                        <th class="font-semibold py-4 px-5 text-center">Stok</th>
                        <th class="font-semibold py-4 px-5 text-right">Harga Grosir</th>
                    </tr>
                </thead>
                <!-- Isi Tabel (Dirender via JavaScript) -->
                <tbody id="katalog-list">
                    <tr>
                        <td colspan="5" class="text-center py-12 text-stone-400">
                            <span class="loading loading-spinner loading-md"></span><br>Menarik data stok...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal (Pop-up) Penampil Foto Produk -->
    <dialog id="modal_produk" class="modal modal-bottom sm:modal-middle backdrop-blur-sm">
        <div class="modal-box rounded-none bg-white p-0 max-w-sm border border-stone-200 shadow-2xl">
            
            <!-- Tombol Tutup (X) -->
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-3 top-3 bg-white/50 text-zinc-900 hover:bg-white backdrop-blur-md border-none z-10">✕</button>
            </form>

            <!-- Area Foto -->
            <figure class="w-full relative bg-stone-100 aspect-[3/4]">
                <img id="modal-foto" src="" alt="Foto Produk" class="w-full h-full object-cover">
            </figure>

            <!-- Area Detail -->
            <div class="p-6">
                <p id="modal-kategori" class="text-[10px] text-stone-400 uppercase tracking-widest mb-1 font-semibold"></p>
                <h3 id="modal-nama" class="text-xl font-normal text-zinc-900 leading-tight mb-2"></h3>
                <p class="text-xs text-stone-500">Varian: <span id="modal-varian" class="font-medium text-zinc-800"></span></p>
                
                <div class="flex justify-between items-center mt-6 pt-4 border-t border-stone-100">
                    <div>
                        <p class="text-[10px] uppercase text-stone-400 tracking-wider font-semibold mb-1">Harga Grosir</p>
                        <p id="modal-harga" class="text-lg font-semibold text-zinc-900"></p>
                    </div>
                    <!-- Tombol Aksi WhatsApp -->
                    <a id="modal-wa" href="#" target="_blank" class="btn bg-zinc-900 text-zinc-50 hover:bg-zinc-800 rounded-none border-none text-[11px] px-6 uppercase tracking-wider font-medium shadow-md">
                        Order Via WA
                    </a>
                </div>
            </div>
        </div>
        <!-- Klik di luar area modal untuk menutup -->
        <form method="dialog" class="modal-backdrop">
            <button>tutup</button>
        </form>
    </dialog>

    <!-- Logika JavaScript (Pengolah Data & Pencarian) -->
    <script>
        let dataBukuInduk = []; // Menyimpan format data asli

        // 1. Mengambil data JSON dari server GitHub Pages
        async function muatDataKatalog() {
            try {
                const respon = await fetch('data/inventory.json');
                const dataMentah = await respon.json();
                
                // Meratakan (Flatten) data agar mudah dibuat menjadi tabel (list) bersusun
                dataMentah.forEach((produk, indeksProduk) => {
                    produk.daftar_varian.forEach((varian, indeksVarian) => {
                        dataBukuInduk.push({
                            id_unik: `prod-${indeksProduk}-${indeksVarian}`,
                            kategori: produk.kategori,
                            nama_model: produk.nama_model,
                            harga_grosir: produk.harga_grosir,
                            warna: varian.warna,
                            stok: varian.stok,
                            foto: varian.foto
                        });
                    });
                });

                renderTabel(dataBukuInduk); // Tampilkan semua saat pertama kali muat
            } catch (kesalahan) {
                document.getElementById('katalog-list').innerHTML = `
                    <tr><td colspan="5" class="text-center text-red-600 py-8">Gagal memuat inventaris. Pastikan file JSON tersedia.</td></tr>
                `;
            }
        }

        // 2. Fungsi merakit HTML Tabel
        function renderTabel(data) {
            const tbody = document.getElementById('katalog-list');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-stone-400 py-10 text-sm">Tidak ada produk yang cocok dengan pencarian Anda.</td></tr>`;
                return;
            }

            data.forEach(item => {
                // Menentukan warna badge stok (merah jika menipis di bawah 30)
                const warnaStok = item.stok < 30 ? 'bg-red-50 text-red-700 border-red-200' : 'bg-stone-50 text-zinc-700 border-stone-200';
                
                const barisHtml = `
                    <tr class="hover:bg-stone-50 cursor-pointer border-b border-stone-100 transition-colors group" 
                        onclick="bukaDetailProduk('${item.id_unik}')">
                        <td class="px-5 text-stone-500">${item.kategori}</td>
                        <td class="px-5 font-medium text-zinc-900 group-hover:text-blue-700 transition-colors">${item.nama_model}</td>
                        <td class="px-5 text-stone-600">${item.warna}</td>
                        <td class="px-5 text-center">
                            <span class="badge ${warnaStok} rounded-none border text-[10px] px-2 py-3 font-semibold">
                                ${item.stok} Pcs
                            </span>
                        </td>
                        <td class="px-5 text-right font-medium text-zinc-900 tracking-wide">
                            Rp ${item.harga_grosir.toLocaleString('id-ID')}
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', barisHtml);
            });
        }

        // 3. Fungsi Pencarian (Search) Real-time
        document.getElementById('kolom-pencarian').addEventListener('input', (e) => {
            const kataKunci = e.target.value.toLowerCase();
            
            // Menyaring data berdasarkan Nama, Kategori, atau Varian Warna
            const dataTerfilter = dataBukuInduk.filter(item => {
                return item.nama_model.toLowerCase().includes(kataKunci) ||
                       item.kategori.toLowerCase().includes(kataKunci) ||
                       item.warna.toLowerCase().includes(kataKunci);
            });
            
            renderTabel(dataTerfilter);
        });

        // 4. Fungsi Menampilkan Modal saat Tabel Diklik
        window.bukaDetailProduk = function(idUnik) {
            // Cari data spesifik dari buku induk
            const item = dataBukuInduk.find(x => x.id_unik === idUnik);
            
            // Suntikkan teks ke dalam pop-up Modal
            document.getElementById('modal-kategori').innerText = item.kategori;
            document.getElementById('modal-nama').innerText = item.nama_model;
            document.getElementById('modal-varian').innerText = item.warna;
            document.getElementById('modal-harga').innerText = 'Rp ' + item.harga_grosir.toLocaleString('id-ID');
            document.getElementById('modal-foto').src = item.foto;
            
            // Siapkan link otomatis WhatsApp
            const teksWa = `Halo Admin Soreang Modest, saya mau order grosir model *${item.nama_model}* varian warna *${item.warna}*. Apakah stoknya masih aman?`;
            document.getElementById('modal-wa').href = `https://wa.me/628123456789?text=${encodeURIComponent(teksWa)}`;
            
            // Tampilkan Modal
            document.getElementById('modal_produk').showModal();
        }

        // Jalankan saat web dibuka pertama kali
        document.addEventListener('DOMContentLoaded', muatDataKatalog);
    </script>
</body>
</html>
